######################################################################
#           tmux configuration
######################################################################

# Set prefix to Ctrl-a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 10000

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# No delay for escape key press
set -sg escape-time 0

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

######################################################################
#                       Key Bindings
######################################################################

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + Shift + Arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move panes between windows
bind-key M choose-window "join-pane -h -t '%%'"  # Move pane to selected window (horizontal)
bind-key V choose-window "join-pane -v -t '%%'"  # Move pane to selected window (vertical)
bind-key B break-pane                            # Break pane to new window

# Copy mode with vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

######################################################################
#                       Status Bar - Aurelia Theme
######################################################################

# Status bar colors (Aurelia theme: pink/magenta accents)
set -g status-style bg=colour235,fg=colour205  # dark bg, bright magenta fg
set -g status-left-length 40
set -g status-right-length 60

# Left status: session name
set -g status-left "#[fg=colour235,bg=colour205,bold] #S #[fg=colour205,bg=colour235] "

# Right status: date and time
set -g status-right "#[fg=colour174,bg=colour235] #[fg=colour235,bg=colour174] %Y-%m-%d %H:%M "

# Window status
setw -g window-status-format "#[fg=colour79] #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour117,bold] #I:#W #[fg=colour117,bg=colour235]"

# Pane borders (Aurelia colors)
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour205

# Message colors
set -g message-style bg=colour205,fg=colour235,bold

# Clock color
setw -g clock-mode-colour colour205

######################################################################
#                       Additional Settings
######################################################################

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Automatic rename
setw -g automatic-rename on
set -g set-titles on

# Display time for status messages
set -g display-time 2000
