######################################################################
#           tmux configuration
######################################################################

# Set prefix to Ctrl-a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 10000

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# No delay for escape key press
set -sg escape-time 0

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

######################################################################
#                       Key Bindings
######################################################################

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + Shift + Arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move panes between windows
bind-key M choose-window "join-pane -h -t '%%'"  # Move pane to selected window (horizontal)
bind-key V choose-window "join-pane -v -t '%%'"  # Move pane to selected window (vertical)
bind-key B break-pane                            # Break pane to new window

# Toggle per-window Claude inactivity alert: Prefix+b
# Monitors for 10s of silence; shows [c] when armed, [!] when pane is idle
bind b if-shell -F '#{==:#{@claude-alert},1}' \
  'setw @claude-alert 0; setw monitor-silence 0; display "Claude alert: OFF"' \
  'setw @claude-alert 1; setw monitor-silence 10; display "Claude alert: ON (10s silence)"'

# Copy mode with vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

######################################################################
#                       Status Bar - Aurelia Theme
######################################################################

# Status bar colors (Aurelia theme: pink/magenta accents)
set -g status-style bg=colour235,fg=colour205  # dark bg, bright magenta fg
set -g status-left-length 40
set -g status-right-length 60
# Refresh window list frequently (default 15s) so alerts / bells update without switching tabs.
set -g status-interval 1

# Left status: session name
set -g status-left "#[fg=colour235,bg=colour205,bold] #S #[fg=colour205,bg=colour235] "

# Right status: date and time
set -g status-right "#[fg=colour174,bg=colour235] #[fg=colour235,bg=colour174] %Y-%m-%d %H:%M "

# [c] = Claude alert armed; [!] = armed and pane has been silent (needs attention)
setw -g window-status-format "#[fg=colour79] #I:#W#{?#{==:#{@claude-alert},1},#{?#{window_silence_flag},#[fg=colour205] [!],#[fg=colour238] [c]},}#[default] "
setw -g window-status-current-format "#[fg=colour235,bg=colour117,bold] #I:#W#{?#{==:#{@claude-alert},1},#{?#{window_silence_flag},#[fg=colour205] [!],#[fg=colour238] [c]},} #[fg=colour117,bg=colour235,nobold]"

# Pane borders (Aurelia colors)
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour205

# Message colors
set -g message-style bg=colour205,fg=colour235,bold

# Clock color
setw -g clock-mode-colour colour205

######################################################################
#                       Additional Settings
######################################################################

# No automatic alerts — per-window Claude alerts use @claude-alert + monitor-silence only
setw -g monitor-activity off
setw -g monitor-bell off
setw -g monitor-silence 0
setw -g window-status-activity-style default
setw -g window-status-bell-style default
set -g activity-action none
set -g bell-action none
set -g silence-action other
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Automatic rename
setw -g automatic-rename on
set -g set-titles on

# Display time for status messages
set -g display-time 2000
